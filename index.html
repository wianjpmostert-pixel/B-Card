<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Virtual Business Card</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <main class="card">
    <div class="card-header">
      <div class="avatar-wrap">
        <img id="avatar" src="avatar.png" alt="avatar" onerror="this.style.display='none'"/>
      </div>
    </div>

    <div class="card-body">
      <h1 id="name">Your Name</h1>
      <p id="title">Your Title • Company</p>

      <div class="contact-list">
        <p><strong>Phone:</strong> <span id="phone">+1 555 555 5555</span></p>
        <p><strong>Email:</strong> <span id="email">you@example.com</span></p>
        <p><strong>Address:</strong> <span id="address">City, Country</span></p>
      </div>
    </div>

    <div class="actions">
      <button id="downloadVcard">Download vCard</button>
    </div>

    <section class="qr">
      <div id="qrcode"></div>
      <p>Scan to save</p>
    </section>

    <!-- Samsung Wallet section removed — personal use only -->

  </main>

  <script src="script.js?t=01b7e3a"></script>
</body>
</html>
